<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Heart -->
  <path d="M50 88 C20 60, 5 40, 20 25 C35 10, 50 20, 50 30 C50 20, 65 10, 80 25 C95 40, 80 60, 50 88Z" 
        fill="url(#heartGrad)" 
        stroke="#fff" 
        stroke-width="2"/>
  
  <!-- Sparkle Top Left -->
  <path d="M18 18 L20 12 L22 18 L28 20 L22 22 L20 28 L18 22 L12 20 Z" 
        fill="url(#sparkleGrad)"/>
  
  <!-- Sparkle Top Right -->
  <path d="M78 15 L80 9 L82 15 L88 17 L82 19 L80 25 L78 19 L72 17 Z" 
        fill="url(#sparkleGrad)"/>
  
  <!-- Small Sparkle -->
  <circle cx="85" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="15" cy="45" r="2" fill="#fbbf24"/>
  
  <!-- 2026 Text -->
  <text x="50" y="58" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">
    2026
  </text>
</svg>
